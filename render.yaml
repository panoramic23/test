services:
  - type: web
    name: luck-the-system
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AMAZON_USE_MOCK
        value: "true"
      - key: SCAN_INTERVAL_SECONDS
        value: "900"
      - key: MIN_DISCOUNT_PERCENT
        value: "35"
